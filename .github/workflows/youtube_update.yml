name: Daily YouTube ETL

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extract + clean + write CSV
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python python/youtube_etl.py

      - name: Commit refreshed CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh data $(date -u +%F)"
           git pull --rebase -X theirs origin main
          git push

      - name: Send email report
        if: always()
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          STATUS: ${{ job.status }}
          TRIGGER: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python python/send_report.py